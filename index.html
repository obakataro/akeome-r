<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>00:00 クイック練習（Discordラグ）</title>
<style>
body {
    background: #020617;
    color: #e5e7eb;
    font-family: system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.game {
    width: 380px;
    background: #020617;
    padding: 24px;
    border-radius: 14px;
    box-shadow: 0 0 30px rgba(0,0,0,.6);
    text-align: center;
}
.clock {
    font-size: 2.2em;
    margin: 12px 0;
    font-variant-numeric: tabular-nums;
}
input, select {
    width: 100%;
    padding: 10px;
    font-size: 1em;
    margin-top: 6px;
}
button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    font-size: 1em;
    cursor: pointer;
}
.result {
    margin-top: 14px;
    line-height: 1.6;
}
.hidden { display: none; }
</style>
</head>
<body>

<div class="game">
    <h2>00:00 クイック練習</h2>

    <label>
        Discord送信ラグ
        <select id="lagPreset">
            <option value="good">🟢 良好</option>
            <option value="normal" selected>🟡 普通</option>
            <option value="bad">🔴 混雑</option>
            <option value="chaos">🎲 カオス</option>
        </select>
    </label>

    <button id="startBtn">スタート</button>

    <div class="clock" id="clock">--:--:--.---</div>

    <input id="input" placeholder="あけおめ" disabled>
    <button id="sendBtn" disabled>送信</button>

    <div class="result" id="result"></div>
    <button id="retryBtn" class="hidden">もう一回 (R)</button>
</div>

<script>
let startTime, timer;
let sent = false;
let firstInputTime = null;
let startOffset = 0;

const clockEl = document.getElementById("clock");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const resultEl = document.getElementById("result");
const retryBtn = document.getElementById("retryBtn");

function format(ms) {
    const d = new Date(0);
    d.setMilliseconds(ms + 86400000);
    return d.toISOString().substr(11, 12);
}

function randomOffset() {
    return -(3000 + Math.random() * 5000);
}

function calcDiscordLag() {
    const preset = document.getElementById("lagPreset").value;
    let base = 0;
    switch (preset) {
        case "good": base = 80; break;
        case "normal": base = 150; break;
        case "bad": base = 250; break;
        case "chaos": base = 120 + Math.random() * 200; break;
    }
    const jitter = -30 + Math.random() * 80;
    return Math.max(0, base + jitter);
}

function startGame() {
    sent = false;
    firstInputTime = null;
    resultEl.textContent = "";
    retryBtn.classList.add("hidden");

    inputEl.value = "";
    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.focus();

    startOffset = randomOffset();
    startTime = performance.now();

    clearInterval(timer);
    timer = setInterval(() => {
        const elapsed = performance.now() - startTime + startOffset;
        clockEl.textContent = format(elapsed);
    }, 10);
}

function send() {
    if (sent || inputEl.value.length === 0) return;
    sent = true;

    clearInterval(timer);
    inputEl.disabled = true;
    sendBtn.disabled = true;

    const now = performance.now();
    const pressTime = now - startTime + startOffset;
    const lag = calcDiscordLag();
    const discordTime = pressTime + lag;

    resultEl.innerHTML = `
        <strong>結果</strong><br>
        押した瞬間: ${pressTime.toFixed(1)} ms<br>
        Discord到達: ${discordTime.toFixed(1)} ms<br><br>
        送信ラグ: ${lag.toFixed(0)} ms
    `;
    retryBtn.classList.remove("hidden");
}

inputEl.addEventListener("keydown", e => {
    if (!firstInputTime) {
        firstInputTime = performance.now() - startTime + startOffset;
    }
    if (e.key === "Enter") send();
});
sendBtn.onclick = send;

document.getElementById("startBtn").onclick = startGame;
retryBtn.onclick = startGame;

document.addEventListener("keydown", e => {
    if (e.key.toLowerCase() === "r" && !retryBtn.classList.contains("hidden")) {
        startGame();
    }
});
</script>

</body>
</html>
