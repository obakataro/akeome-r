<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>あけおめ00:00 クイック練習</title>
<style>
body {
    background: #020617;
    color: #e5e7eb;
    font-family: system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.game {
    width: 360px;
    background: #020617;
    padding: 24px;
    border-radius: 14px;
    box-shadow: 0 0 30px rgba(0,0,0,.6);
    text-align: center;
}
.clock {
    font-size: 2.2em;
    margin: 12px 0;
    font-variant-numeric: tabular-nums;
}
input {
    width: 100%;
    padding: 10px;
    font-size: 1em;
}
button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    font-size: 1em;
    cursor: pointer;
}
.result {
    margin-top: 14px;
    line-height: 1.6;
}
.hidden {
    display: none;
}
</style>
</head>
<body>

<div class="game">
    <h2>00:00 クイック練習</h2>

    <button id="startBtn">スタート</button>

    <div class="clock" id="clock">--:--:--.---</div>

    <input id="input" placeholder="あけおめ" disabled>

    <div class="result" id="result"></div>

    <button id="retryBtn" class="hidden">もう一回 (R)</button>
</div>

<script>
let startTime;
let timer;
let sent = false;
let firstInputTime = null;
let startOffset = 0;

const clockEl = document.getElementById("clock");
const inputEl = document.getElementById("input");
const resultEl = document.getElementById("result");
const startBtn = document.getElementById("startBtn");
const retryBtn = document.getElementById("retryBtn");

function format(ms) {
    const d = new Date(0);
    d.setMilliseconds(ms + 86400000);
    return d.toISOString().substr(11, 12);
}

function randomOffset() {
    return -(3000 + Math.random() * 5000); // -3000 ～ -8000
}

function startGame() {
    sent = false;
    firstInputTime = null;
    resultEl.textContent = "";
    retryBtn.classList.add("hidden");

    inputEl.value = "";
    inputEl.disabled = false;
    inputEl.focus();

    startOffset = randomOffset();
    startTime = performance.now();

    clearInterval(timer);
    timer = setInterval(() => {
        const elapsed = performance.now() - startTime + startOffset;
        clockEl.textContent = format(elapsed);
    }, 10);
}

function rankReaction(ms) {
    if (ms <= 70) return "🟣 プロ";
    if (ms <= 150) return "🔵 速い";
    if (ms <= 300) return "🟢 人間";
    if (ms <= 700) return "🟡 慎重";
    return "🔴 迷ってる";
}

function rankAccuracy(ms) {
    const a = Math.abs(ms);
    if (a <= 10) return "👑 神";
    if (a <= 50) return "⚡ かなり強い";
    if (a <= 150) return "🙂 良";
    if (a <= 300) return "😐 可";
    return "😇 修行";
}

function send() {
    if (sent || inputEl.value.length < 1) return;
    sent = true;

    clearInterval(timer);
    inputEl.disabled = true;

    const now = performance.now();
    const sendTime = now - startTime + startOffset;
    const reaction = sendTime - firstInputTime;

    const accRank = rankAccuracy(sendTime);
    const reactRank = rankReaction(reaction);

    resultEl.innerHTML = `
        <strong>結果</strong><br>
        送信誤差: ${sendTime.toFixed(1)} ms<br>
        精度評価: ${accRank}<br><br>
        入力速度: ${reaction.toFixed(1)} ms<br>
        入力評価: ${reactRank}
    `;

    retryBtn.classList.remove("hidden");
}

inputEl.addEventListener("keydown", e => {
    if (!firstInputTime) {
        firstInputTime = performance.now() - startTime + startOffset;
    }
    if (e.key === "Enter") send();
});

startBtn.onclick = startGame;
retryBtn.onclick = startGame;

document.addEventListener("keydown", e => {
    if (e.key.toLowerCase() === "r" && !retryBtn.classList.contains("hidden")) {
        startGame();
    }
});
</script>

</body>
</html>
