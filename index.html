<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>あけおめ00:00練習ゲーム</title>
<style>
    body {
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #e5e7eb;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .game {
        background: #020617;
        padding: 24px;
        border-radius: 12px;
        width: 320px;
        text-align: center;
        box-shadow: 0 0 30px rgba(0,0,0,.5);
    }
    .clock {
        font-size: 2em;
        margin: 16px 0;
        font-variant-numeric: tabular-nums;
    }
    input {
        width: 100%;
        padding: 8px;
        font-size: 1em;
        margin-bottom: 8px;
    }
    button {
        width: 100%;
        padding: 10px;
        font-size: 1em;
        cursor: pointer;
    }
    .result {
        margin-top: 12px;
        font-size: 1.1em;
    }
</style>
</head>
<body>

<div class="game">
    <h2>あけおめ00:00練習</h2>
    <button id="startBtn">スタート</button>

    <div class="clock" id="clock">23:59:45.000</div>

    <input id="message" placeholder="あけおめ" disabled>
    <button id="sendBtn" disabled>送る</button>

    <div class="result" id="result"></div>
</div>

<script>
let startTime = null;
let timer = null;
let sent = false;

const clockEl = document.getElementById("clock");
const startBtn = document.getElementById("startBtn");
const sendBtn = document.getElementById("sendBtn");
const messageInput = document.getElementById("message");
const resultEl = document.getElementById("result");

const START_OFFSET = -15000; // 23:59:45 = -15000ms
const ZERO_TIME = 0;

function formatTime(ms) {
    const base = new Date(0);
    base.setMilliseconds(ms + 24*60*60*1000);
    return base.toISOString().substr(11, 12);
}

function startGame() {
    sent = false;
    resultEl.textContent = "";
    messageInput.value = "";
    messageInput.disabled = false;
    sendBtn.disabled = false;

    startTime = performance.now();
    clearInterval(timer);

    timer = setInterval(() => {
        const now = performance.now();
        const elapsed = now - startTime + START_OFFSET;
        clockEl.textContent = formatTime(elapsed);
    }, 10);
}

function sendMessage() {
    if (sent) return;
    sent = true;

    const now = performance.now();
    const elapsed = now - startTime + START_OFFSET;
    clearInterval(timer);

    if (elapsed < ZERO_TIME) {
        resultEl.textContent = "❌ おてつき！";
    } else {
        resultEl.textContent = `🎉 +${Math.floor(elapsed)} ms`;
    }

    messageInput.disabled = true;
    sendBtn.disabled = true;
}

startBtn.onclick = startGame;
sendBtn.onclick = sendMessage;

messageInput.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
